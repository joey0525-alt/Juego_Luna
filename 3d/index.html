<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Luna 3D</title>
  <meta name="description" content="Prototipo 3D: Luna pasea por un pueblo de juguete y vive en su casa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style3d.css?v=7">
  <link rel="stylesheet" href="../css/fun.css?v=7">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#c48ad8">
</head>
<body>
  <canvas id="c" aria-label="Mundo 3D de Luna. Flechas o WASD para caminar, Espacio para entrar."></canvas>
  <header id="hud" class="hud" hidden></header>
  <div id="prompt" class="prompt" hidden></div>
  <button id="guide" class="guide" hidden aria-label="Pío, tu guía"></button>
  <button id="guideSkip" class="guide-skip" hidden aria-label="Ahora no: otra idea">⏭️ <span>Ahora no</span></button>
  <div id="roominfo" class="roominfo" hidden></div>
  <div id="actions" class="actions" hidden></div>
  <div id="forestHud" class="forest-hud" hidden></div>
  <div id="gameHud" class="forest-hud" hidden></div>
  <div id="train3" class="train3" hidden>
    <div id="t3-head" class="t3-head"></div>
    <div id="t3-seq" class="t3-seq"></div>
    <div class="t3-pad"><button data-arrow="up" aria-label="Arriba">⬆️</button><button data-arrow="left" aria-label="Izquierda">⬅️</button><button data-arrow="down" aria-label="Abajo">⬇️</button><button data-arrow="right" aria-label="Derecha">➡️</button></div>
  </div>
  <div id="card3" class="card3" hidden><div id="card3-box" class="card3-box" role="dialog" aria-modal="true"></div></div>

  <div class="touch" aria-hidden="true">
    <div id="joy" class="joy"><div id="knob" class="knob"></div></div>
    <button id="abtn" class="abtn">A</button>
  </div>

  <div id="picker" class="picker" hidden>
    <div class="pbox">
      <h1>LUNA <span>3D</span></h1>
      <div id="pick-list" class="pick-list"></div>
      <button type="button" class="slot cloud-login" data-cloudlogin aria-label="Entrar con mi usuario">☁️ Entrar</button>
      <form id="new-form" class="new-form" autocomplete="off">
        <input id="new-name" maxlength="16" placeholder="✏️ Tu nombre" aria-label="Tu nombre">
        <input id="new-petname" maxlength="14" placeholder="🐶 Luna" aria-label="Nombre de la perrita">
        <div id="avatars3" class="coats avatars" aria-label="Tu cara"></div>
        <div id="coats" class="coats" aria-label="Color de Luna"></div>
        <button class="go" type="submit" aria-label="Nueva partida">➕ 🐶</button>
      </form>
      <details class="parents3d"><summary>👨‍👩‍👧</summary><div id="voice-slot"></div></details>
      <a class="back2d" href="../index.html">🕹️ Juego 2D</a>
    </div>
  </div>

  <div id="fade" class="fade"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="pop" class="pop" aria-hidden="true"></div>

  <script>window.LUNA_BASE = '../';</script>
  <script src="../js/data.js?v=7"></script>
  <script src="../js/sim.js?v=7"></script>
  <script src="../js/voice.js?v=7"></script>
  <script src="../js/sounds.js?v=7"></script>
  <script src="../js/music.js?v=7"></script>
  <script src="../js/cloud.js?v=7"></script>
  <script src="../js/extras.js?v=8"></script>
  <script src="../js/fun.js?v=7"></script>
  <script src="luna3d.js?v=7"></script>
</body>
</html>
